<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCDB Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="/static/js/admin.js" defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(17, 25, 40, 0.75);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <!-- Login Form -->
    <div id="loginForm" class="min-h-screen flex items-center justify-center">
        <div class="glass-effect p-8 rounded-lg shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                    <input type="text" name="username" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" name="password" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md font-medium transition duration-150 ease-in-out">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden min-h-screen">
        <!-- Navigation -->
        <nav class="bg-gray-800 border-b border-gray-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-shield-alt text-blue-500 text-2xl"></i>
                        </div>
                        <div class="ml-4 text-xl font-bold">NCDB Admin</div>
                    </div>
                    <button id="logoutBtn" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                        Logout
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Tabs -->
            <div class="flex space-x-4 mb-8">
                <button class="tab-btn active px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-700" data-tab="suspects">
                    Manage Suspects
                </button>
                <button class="tab-btn px-4 py-2 rounded-md bg-gray-700 hover:bg-gray-600" data-tab="tips">
                    Review Tips
                </button>
            </div>

            <!-- Suspects Tab -->
            <div id="suspectsTab" class="space-y-6">
                <!-- Add New Suspect Button -->
                <button id="addSuspectBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-md font-medium transition duration-150 ease-in-out">
                    <i class="fas fa-plus mr-2"></i>Add New Suspect
                </button>

                <!-- Suspects List -->
                <div class="glass-effect rounded-lg p-6">
                    <h2 class="text-xl font-bold mb-4">Suspects List</h2>
                    <div id="suspectsList" class="space-y-4">
                        <!-- Suspects will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Tips Tab -->
            <div id="tipsTab" class="hidden space-y-6">
                <div class="glass-effect rounded-lg p-6">
                    <h2 class="text-xl font-bold mb-4">Anonymous Tips</h2>
                    <div id="tipsList" class="space-y-4">
                        <!-- Tips will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Suspect Modal -->
        <div id="suspectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            <div class="glass-effect rounded-lg p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                <h2 id="modalTitle" class="text-xl font-bold mb-4">Add New Suspect</h2>
                <form id="suspectForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Name</label>
                            <input type="text" name="name" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Alias</label>
                            <input type="text" name="alias" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Date of Birth</label>
                            <input type="text" name="date_of_birth" placeholder="mm/dd/yyyy" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Nationality</label>
                            <input type="text" name="nationality" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Status</label>
                            <select name="status" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                                <option value="wanted">Wanted</option>
                                <option value="arrested">Arrested</option>
                                <option value="convicted">Convicted</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Crime Type</label>
                            <select name="crime_type" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                                <option value="cybercrime">Cybercrime</option>
                                <option value="financial">Financial Fraud</option>
                                <option value="violent">Violent Offenses</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Description</label>
                        <textarea name="description" rows="4" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Last Seen</label>
                        <input type="text" name="last_seen" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Image URL (Optional)</label>
                        <input type="text" name="image_url" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                        <p class="text-sm text-gray-400 mt-1">Leave empty to automatically fetch image based on name</p>
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="cancelSuspectBtn" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-md font-medium transition duration-150 ease-in-out">
                            Cancel
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md font-medium transition duration-150 ease-in-out">
                            Save Suspect
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
